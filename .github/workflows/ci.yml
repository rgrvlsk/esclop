# SPDX-License-Identifier: GPL-3.0-or-later
# Build and test Swift, the engine and bundled tools on every pull request and push to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# No concurrency group: every push gets a run that finishes. Cancelled runs send the same
# notification as failed ones, and runners cost nothing on a public repository.

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  privacy:
    name: secrets and private paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner
      - name: Private paths
        run: python3 Scripts/privacy-check.py

  swift:
    name: swift build and test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script and workflow checks share this macOS runner: they need clang, lipo and otool,
      # and each job of its own waits for a runner when macOS capacity is short.
      # A pinned release instead of `brew install`, which spent most of this job's minutes.
      - name: actionlint
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_arm64.tar.gz"
          echo "aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f  actionlint.tar.gz" | shasum -a 256 -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint
      - name: Shell syntax
        run: for f in Scripts/*.sh; do bash -n "$f" || exit 1; done
      - name: Licence gate tests
        run: Scripts/licence-gate-test.sh
      - name: Release notes render from CHANGELOG.md
        run: Scripts/release-notes.sh --unreleased 0.0.0 > /dev/null
      - run: swift --version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      # With Xcode on the runner, Package.swift includes the app, so this also compiles EsclopApp.
      - run: swift build --build-tests
      # The upload tests start a local S3 server (moto); install it before the suite starts.
      - name: Local S3 server for the upload tests
        run: Scripts/s3-test-server.sh install
      # Suites that need ffmpeg, gs, gifsicle or esclop-engine skip here; the gate job reruns
      # them with the real tools. The suite takes under a minute; a hang fails after 5 minutes
      # with the unfinished tests and their stacks (Scripts/test.sh), not at the job timeout.
      # Render suites hold the main actor for seconds per image on a runner without a GPU, so
      # they run on their own instead of beside the app's main-actor suites.
      - run: Scripts/test.sh --skip RenderTests
        timeout-minutes: 10
        env:
          ESCLOP_TEST_TIMEOUT: "300"
      - name: Render tests
        run: Scripts/test.sh --filter RenderTests
        timeout-minutes: 10
        env:
          ESCLOP_TEST_TIMEOUT: "300"
      # The ProcessRunner stress judges run alone, so their CPU load cannot skew the
      # wall-clock assertions of the other suites.
      - name: ProcessRunner stress tests
        run: Scripts/test.sh --filter ProcessRunnerStressTests
        timeout-minutes: 10
        env:
          ESCLOP_STRESS: "1"
          ESCLOP_TEST_TIMEOUT: "300"
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}

  # The app's Liquid Glass needs the macOS 26 SDK (Swift 6.2, Xcode 26). The job above stays on
  # macos-15, where the app compiles its HUD-material fallback; this one builds what ships.
  app-xcode-26:
    name: app with Xcode 26
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift 6.2 or later
        run: |
          swift --version
          swift --version 2>&1 | grep -Eq 'Swift version (6\.([2-9]|[1-9][0-9])|[7-9])' || { echo "The macOS 26 SDK (Swift 6.2+) is needed for Liquid Glass." >&2; exit 1; }
      - run: swift build --build-tests
      # The upload tests start a local S3 server (moto); install it before the suite starts.
      - name: Local S3 server for the upload tests
        run: Scripts/s3-test-server.sh install
      - run: Scripts/test.sh --filter EsclopAppTests --skip RenderTests
        timeout-minutes: 10
        env:
          ESCLOP_TEST_TIMEOUT: "300"
      - name: Render tests
        run: Scripts/test.sh --filter RenderTests
        timeout-minutes: 10
        env:
          ESCLOP_TEST_TIMEOUT: "300"

  binaries:
    uses: ./.github/workflows/binaries.yml

  # The app as it ships: bundled, signed ad hoc, copied elsewhere and started with the build
  # directory out of the way. Tests run from the build directory and cannot see an app that
  # only finds its resources there.
  app-bundle:
    name: app bundle starts on its own
    needs: [binaries]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{tools,engine}"
          merge-multiple: true
      - name: Unpack into Binaries/
        run: |
          tar -xf tools.tar -C Binaries
          tar -xf engine.tar -C Binaries
      - name: Bundle the app
        run: Scripts/bundle-app.sh
        env:
          ESCLOP_SOURCE_URL: ""
      - name: Start it from a copy
        run: Scripts/smoke-app.sh "dist/L'Esclop.app"
        timeout-minutes: 5
      # Version N finds N+1 on a local feed, downloads it and installs it over itself.
      - name: It updates itself
        run: Scripts/update-e2e.sh "dist/L'Esclop.app"
        timeout-minutes: 8

  gate:
    name: licence gate and tests with the real tools
    needs: [binaries]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{tools,engine}"
          merge-multiple: true
      - name: Unpack into Binaries/
        run: |
          tar -xf tools.tar -C Binaries
          tar -xf engine.tar -C Binaries
          ls -l Binaries
      - name: Payload size per architecture
        run: Scripts/payload-size.sh Binaries
      # Limit payload growth above the measured 96.7 MB with a 5 % margin.
      - name: Licence gate over Binaries/
        run: Scripts/licence-gate.sh --universal --max-mb 102 Binaries
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      # The render suites already ran in the swift job; they need no bundled tools.
      # The upload tests start a local S3 server (moto); install it before the suite starts.
      - name: Local S3 server for the upload tests
        run: Scripts/s3-test-server.sh install
      - name: swift test with the bundled tools
        run: Scripts/test.sh --skip RenderTests
        timeout-minutes: 10
        env:
          ESCLOP_TEST_TIMEOUT: "300"
