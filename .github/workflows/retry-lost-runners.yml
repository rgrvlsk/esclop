# SPDX-License-Identifier: GPL-3.0-or-later
# Reruns a ci run once when GitHub never gave some of its jobs a runner ("The job was not
# acquired by Runner of type hosted even after multiple attempts", seen when macOS arm64
# capacity is short). Such a job ends cancelled or failed with no runner and no steps. The
# run is rerun only when every unsuccessful job is of that kind, so a real failure is never
# retried away.
name: retry lost runners

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.run_attempt == 1 &&
      contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      EVENT: ${{ github.event.workflow_run.event }}
    steps:
      - name: Rerun when every unsuccessful job never got a runner
        run: |
          # A pull request run that a newer push replaced (ci's concurrency group cancels it) also
          # ends with jobs that never got a runner. Rerunning it would bring the old commit back.
          # Runs on main are never cancelled, so a lost one there is always rerun.
          # ponytail: matches by head branch name, so two fork PRs from same-named branches share
          # "newest" and one may miss its rerun; compare head_sha if outside contributors arrive.
          if [ "$EVENT" = pull_request ]; then
            newest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci --branch "$BRANCH" --event "$EVENT" --limit 1 --json databaseId --jq '.[0].databaseId')"
            if [ "$newest" != "$RUN_ID" ]; then echo "A newer ci run ($newest) replaced this one; not rerunning."; exit 0; fi
          fi
          jobs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/1/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")
                  | "\(if ((.runner_name // "") == "" and (.steps | length) == 0) then "lost" else "real" end) \(.name)"')"
          printf '%s\n' "$jobs"
          if [ -z "$jobs" ]; then echo "Nothing failed or was cancelled."; exit 0; fi
          if printf '%s\n' "$jobs" | grep -q '^real '; then
            echo "A job failed after it started; not rerunning."
            exit 0
          fi
          echo "Every unsuccessful job never got a runner; rerunning them."
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
