# SPDX-License-Identifier: GPL-3.0-or-later
# On a tag v<version>: build everything universal, run the licence gate, package the CLI and
# the complete corresponding source, and open a DRAFT GitHub release with them. A person
# reviews and publishes the draft.
#
# Run it by hand (workflow_dispatch) for a dry run: same build and artefacts, kept as a workflow
# artefact, no release.
#
# When a person publishes the release (pre-release or not), the feed job signs its DMG with the
# EdDSA key (secret SPARKLE_ED_PRIVATE_KEY) and publishes appcast.xml on the appcast branch, the
# fixed address installed apps read (docs/release.md › Updates).
#
# Signing and notarisation read these secrets by name and are skipped when they are absent:
#   MACOS_CERTIFICATE           base64 of a Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   notarytool credentials (app-specific password)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  binaries:
    if: github.event_name != 'release'
    uses: ./.github/workflows/binaries.yml
    with:
      tool-sources: true

  package:
    name: package and draft release
    if: github.event_name != 'release'
    needs: [binaries]
    # The app ships Liquid Glass, which needs the macOS 26 SDK; the tools come from binaries.yml.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      # The menu bar app ships as a DMG. "false" assembles the .app as a smoke test of
      # Scripts/bundle-app.sh only: no DMG is made or attached.
      SHIP_APP: "true"
      ESCLOP_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      ESCLOP_BUILD_NUMBER: ${{ github.run_number }}
      # SwiftPM writes its build directory into the binaries; keep it outside the runner's home.
      ESCLOP_SCRATCH_PATH: /private/tmp/esclop-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Swift 6.2 or later (Liquid Glass)
        run: |
          swift --version
          swift --version 2>&1 | grep -Eq 'Swift version (6\.([2-9]|[1-9][0-9])|[7-9])' || { echo "The macOS 26 SDK (Swift 6.2+) is needed for Liquid Glass." >&2; exit 1; }
      - name: Signing keychain path
        run: echo "KEYCHAIN=$RUNNER_TEMP/esclop-signing.keychain-db" >> "$GITHUB_ENV"
      - name: Rust toolchain (cargo vendor, the gate's cargo tree)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: zstd
        run: command -v zstd || brew install zstd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{tools,engine,tool-sources,engine-sources}"
          merge-multiple: true
      - name: Unpack into Binaries/
        run: |
          tar -xf tools.tar -C Binaries
          tar -xf engine.tar -C Binaries
          mkdir -p Binaries/.cache && tar -xf tool-sources.tar -C Binaries/.cache
          tar -xf engine-sources.tar -C Binaries/.cache
          rm -f tools.tar engine.tar tool-sources.tar engine-sources.tar
      - name: Licence gate over Binaries/
        run: Scripts/licence-gate.sh --universal Binaries

      # ---------------------------------------------------------------- signing (optional)
      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$kc_pass" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$KEYCHAIN" > /dev/null
          search=("$KEYCHAIN")
          while read -r k; do search+=("$(printf '%s' "$k" | tr -d '"')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search[@]}"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          echo "ESCLOP_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Store notarisation credentials
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials esclop-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
          echo "ESCLOP_NOTARY_PROFILE=esclop-notary" >> "$GITHUB_ENV"
      - name: Signing skipped
        if: env.HAS_CERT != 'true' || env.HAS_NOTARY != 'true'
        run: |
          echo "::notice::Signing secrets present: ${HAS_CERT}, notarisation secrets present: ${HAS_NOTARY}. Missing ones are skipped; without a certificate the binaries are signed ad hoc."

      # ---------------------------------------------------------------- artefacts
      - name: Package the CLI and the corresponding source
        run: |
          if [ "$DRY_RUN" = true ]; then
            Scripts/package-release.sh --dry-run
          else
            Scripts/package-release.sh --ref "$GITHUB_REF_NAME"
          fi

      - name: App and DMG
        # With SHIP_APP false, app bundling is only a smoke check.
        continue-on-error: ${{ env.SHIP_APP != 'true' }}
        run: |
          Scripts/bundle-app.sh
          if [ "$SHIP_APP" != true ]; then
            echo "::notice::App/DMG skipped: SHIP_APP is false. The .app above was a smoke test and is not attached."
            exit 0
          fi
          app="dist/L'Esclop.app"
          [ -d "$app" ] || { echo "::error::Scripts/bundle-app.sh produced no app"; exit 1; }
          # What goes into the DMG must start on a Mac that never saw this checkout.
          Scripts/smoke-app.sh "$app"
          # The same rule as the CLI archive: nothing shipped names the machine that built it.
          for f in "$app"/Contents/MacOS/* "$app"/Contents/Resources/bin/*; do
            if LC_ALL=C grep -aEq '/(Users|home)/[[:alnum:]_.-]+' "$f"; then
              strings -a "$f" | grep -E '/(Users|home)/[[:alnum:]_.-]+' | sort -u | head -5
              echo "::error::${f##*/} in the app contains a home directory path (listed above)"; exit 1
            fi
          done
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          dmg="dist/LEsclop-$version.dmg"
          hdiutil create -volname "L'Esclop" -srcfolder "$app" -fs APFS -format ULFO -ov "$dmg"
          if [ -n "${ESCLOP_SIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$ESCLOP_SIGN_IDENTITY" "$dmg"
          fi
          if [ -n "${ESCLOP_NOTARY_PROFILE:-}" ]; then
            xcrun notarytool submit "$dmg" --keychain-profile "$ESCLOP_NOTARY_PROFILE" --wait
            xcrun stapler staple "$dmg"
          fi
          (cd dist && shasum -a 256 "$(basename "$dmg")" >> SHA256SUMS)

      - name: Keep the artefacts on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # A branch name may hold a slash, which an artefact name may not.
          name: release-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          path: |
            dist/*.tar.*
            dist/*.dmg
            dist/SHA256SUMS
            dist/release-notes.md
          retention-days: 14

      - name: Draft GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.tar.* dist/SHA256SUMS)
          for d in dist/*.dmg; do [ -f "$d" ] && files+=("$d"); done
          if draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$draft" = true ] || { echo "::error::Refusing to replace assets of a published release"; exit 1; }
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "L'Esclop ${GITHUB_REF_NAME#v}" --notes-file dist/release-notes.md "${files[@]}"
          fi

      - name: Remove the signing keychain
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$KEYCHAIN" || true

  # ---------------------------------------------------------------- update feed
  feed:
    name: update feed
    if: github.event_name == 'release'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: appcast
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: The release's DMG
        run: |
          mkdir -p dist
          gh release download "$TAG" --pattern 'LEsclop-*.dmg' --dir dist
          dmg="$(ls dist/LEsclop-*.dmg)"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          echo "DMG_URL=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$(basename "$dmg")" >> "$GITHUB_ENV"
      - name: Sign it and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "::error::The SPARKLE_ED_PRIVATE_KEY secret is missing"; exit 1; }
          Scripts/appcast.sh "$DMG" "$DMG_URL" dist/appcast.xml
      - name: Publish it on the appcast branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          build="$(python3 -c 'import re,sys; print(re.search(r"<sparkle:version>([^<]+)<", open(sys.argv[1]).read()).group(1))' dist/appcast.xml)"
          git worktree add --detach "$RUNNER_TEMP/feed"
          cd "$RUNNER_TEMP/feed"
          if git fetch --depth 1 origin appcast 2>/dev/null; then
            git checkout -B appcast FETCH_HEAD
            # Never go back: publishing an older release again leaves the newer one in the feed.
            if [ -f appcast.xml ]; then
              current="$(python3 -c 'import re,sys; print(re.search(r"<sparkle:version>([^<]+)<", open(sys.argv[1]).read()).group(1))' appcast.xml)"
              if [ "$build" -le "$current" ]; then
                echo "::notice::The feed already offers build $current; $TAG is build $build, so the feed stays as it is."
                exit 0
              fi
            fi
          else
            git checkout --orphan appcast
            git rm -rfq .
          fi
          cp "$GITHUB_WORKSPACE/dist/appcast.xml" appcast.xml
          git add appcast.xml
          git commit -qm "Offer $TAG (build $build) to installed apps"
          git push origin HEAD:appcast
          echo "::notice::https://raw.githubusercontent.com/${{ github.repository }}/appcast/appcast.xml now offers $TAG"
