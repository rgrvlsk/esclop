[workspace]
resolver = "3"
members = ["crates/esclop-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/rgrvlsk/esclop"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3
