# SPDX-License-Identifier: GPL-3.0-or-later
# `cargo about generate -c about.toml about.hbs -o THIRD_PARTY-engine.md` lists every crate
# linked into esclop-engine with its licence text.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-3-Clause-Clear",
    "ISC",
    "Zlib",
    "IJG",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
# notices for the default build (avif-aom)
ignore-dev-dependencies = true

# our own crate (publish = false) is not third-party
[private]
ignore = true
